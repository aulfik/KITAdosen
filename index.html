<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Layanan Dosen</title>
    <meta name="description" content="Quick links portal untuk layanan dan aplikasi dosen.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-animation"></div>

    <main class="container">
        <header class="header">
            <div class="logo-container">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
            </div>
            <h1>Semua Tentang Dosen</h1>
            <p>Akses cepat ke berbagai layanan yang banyak di Indonesia.</p>

            <div class="search-container">
                <i class="fa-solid fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Cari layanan (misal: Sinta, Sister, Bima)...">
            </div>
        </header>

        <div id="contentContainer">
            <!-- Content will be populated by JavaScript -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Semua Tentang Dosen. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
